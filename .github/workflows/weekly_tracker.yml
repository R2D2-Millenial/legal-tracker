name: Weekly Legal Intelligence Dispatch

on:
  schedule:
    # Runs automatically every Monday at 07:00 AM IST (01:30 AM UTC)
    - cron: '30 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  run-tracker:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Extraction & Site Generation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c "
          from src.scraper import fetch_weekly_feed_entries
          from src.analyzer import analyze_legal_news
          from src.generator import build_html_dashboard
          import json, os

          print('Ingesting legal feeds...')
          raw_entries = fetch_weekly_feed_entries()

          print('Synthesizing with Gemini...')
          updates = analyze_legal_news(raw_entries)

          print('Saving weekly updates to data/updates.json...')
          os.makedirs('data', exist_ok=True)
          with open('data/updates.json', 'w', encoding='utf-8') as f:
              json.dump(updates, f, indent=2, ensure_ascii=False)

          print('Generating static dashboard and synchronizing archive...')
          build_html_dashboard(updates)
          "

      - name: Commit and Push Persistent Archive
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/archive.json data/updates.json index.html
          git diff --staged --quiet || (git commit -m "chore: persist regulatory archive [skip ci]" && git push)

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
